name: Generate contribution snake 🐍

on:
  schedule:
    - cron: "0 */12 * * *"  # Runs every 12 hours
  workflow_dispatch:  # Allows manual run
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate the snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff4ecd&color_dots=#0d1117,#3a0f3f,#6a1b9a,#d81b60,#ff4ecd
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff4ecd&color_dots=#0d1117,#3a0f3f,#6a1b9a,#d81b60,#ff4ecd

      - name: Push generated files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

